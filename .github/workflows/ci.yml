name: Web Automation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Configure display for headless Chrome
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 &

      - name: Run all tests
        run: mvn test -DsuiteXmlFile=src/test/resources/full-suite.xml
        env:
          IMPLICIT_WAIT: 15
          EXPLICIT_WAIT: 30
          PAGE_LOAD_TIMEOUT: 60

      - name: Rename report to index.html for GitHub Pages
        run: |
          mkdir -p reports
          if [ -f reports/AutomationReport.html ]; then
            cp reports/AutomationReport.html reports/index.html
          fi
        if: always()

      - name: Upload ExtentReport to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main' && always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          publish_branch: gh-pages
          force_orphan: true

      - name: Upload reports as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extent-report
          path: reports/
